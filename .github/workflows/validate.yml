name: Validate Tutorial

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    name: Static validation (Python 3.11)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run static validation suite
        run: |
          pytest tests/ -v --tb=short

      - name: Verify no embedded credentials
        run: |
          pytest tests/test_tutorial_content.py::TestNoEmbeddedCredentials -v --tb=short
